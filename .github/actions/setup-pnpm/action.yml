name: Set up Node and pnpm
description: Install the locked Creative Art Studio dependencies for a CI quality job.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.4.1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
